[project]
name = "cspa"
version = "0.1.0"
description = "Cash-safe purchasing assistant: quantile demand forecasts, a Monte Carlo cash gate and a marginal-value allocator."
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src", "scripts", "tests/fixtures"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
